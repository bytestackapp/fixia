<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FDFBF8" />
  <title>Fixia</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <style>
    :root {
      --navy: #04134a;
      --orange: #ff5a00;
      --paper: #fdfbf8;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --splash-ms: 3000ms;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--paper); }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 50% at 50% 38%, #ffffff 0%, rgba(255, 255, 255, 0) 70%),
        linear-gradient(180deg, #fffaf5 0%, var(--paper) 45%, #f4f7fd 100%);
      overflow: hidden;
      transition: opacity 0.4s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }

    /* ── Soft background shapes ───────────────────────────── */
    .blob { position: absolute; z-index: 0; }
    .blob-tl {
      top: -26vw; left: -30vw;
      width: 90vw; height: 78vw;
      border-radius: 0 0 70% 0;
      background: radial-gradient(circle at 30% 40%, #fdeadb 0%, #fef3ea 100%);
      transform: rotate(-6deg);
    }
    .blob-tr {
      top: -14vw; right: -34vw;
      width: 72vw; height: 62vw;
      border-radius: 60% 0 55% 50%;
      background: #e9eefb;
    }
    .blob-mr {
      top: 52%; right: -26vw;
      width: 44vw; height: 52vw;
      border-radius: 50%;
      background: #eaeffa;
      opacity: 0.7;
    }
    .blob-bl {
      bottom: 24%; left: -22vw;
      width: 52vw; height: 46vw;
      border-radius: 55% 45% 50% 50%;
      background: #e8eefb;
      opacity: 0.8;
    }

    /* ── Brand block ──────────────────────────────────────── */
    .brand {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      width: 100%;
      padding: 0 8vw;
      margin-top: -14vh;
    }
    .logo {
      width: min(78vw, 360px);
      height: auto;
      display: block;
      opacity: 0;
      transform: scale(0.96);
      animation: logoIn 0.7s cubic-bezier(.2, .7, .2, 1) 0.1s forwards;
    }
    @keyframes logoIn { to { opacity: 1; transform: none; } }

    /* ── Category icons ───────────────────────────────────── */
    .cats {
      display: flex; gap: clamp(8px, 2.6vw, 14px);
      margin-top: clamp(28px, 6vh, 52px);
    }
    .cat {
      width: clamp(34px, 10vw, 46px);
      height: clamp(34px, 10vw, 46px);
      border-radius: 50%;
      display: grid; place-items: center;
      box-shadow: 0 4px 10px rgba(30, 50, 110, 0.12);
      opacity: 0;
      transform: translateY(8px);
      animation: catIn 0.45s ease forwards;
    }
    .cat:nth-child(1) { animation-delay: 0.45s; }
    .cat:nth-child(2) { animation-delay: 0.53s; }
    .cat:nth-child(3) { animation-delay: 0.61s; }
    .cat:nth-child(4) { animation-delay: 0.69s; }
    .cat:nth-child(5) { animation-delay: 0.77s; }
    .cat:nth-child(6) { animation-delay: 0.85s; }
    .cat:nth-child(7) { animation-delay: 0.93s; }
    @keyframes catIn { to { opacity: 1; transform: none; } }
    .cat svg {
      width: 52%; height: 52%;
      fill: none; stroke: #fff; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .cat.more { background: #eef0f4; box-shadow: none; }
    .cat.more svg { fill: #8c97b8; stroke: none; }

    /* ── Loading bar ──────────────────────────────────────── */
    .bar {
      margin-top: clamp(22px, 4.5vh, 38px);
      width: 150px; height: 5px;
      border-radius: 3px;
      background: rgba(4, 19, 74, 0.1);
      overflow: hidden;
    }
    .bar::after {
      content: "";
      display: block; height: 100%; width: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--navy), var(--orange));
    }
    #splash.run .bar::after { animation: fill var(--splash-ms) cubic-bezier(.3, .6, .4, 1) forwards; }
    @keyframes fill { to { width: 100%; } }

    /* ── City skyline + pin ───────────────────────────────── */
    .city {
      position: absolute; left: 0; right: 0;
      bottom: calc(14vh + var(--safe-bottom));
      width: 100%; height: 22vh; max-height: 190px;
      z-index: 1;
    }

    /* ── Waves ────────────────────────────────────────────── */
    .waves {
      position: absolute; left: 0; bottom: 0;
      width: 100%; height: calc(20vh + var(--safe-bottom));
      z-index: 1;
    }

    /* ── Footer text ──────────────────────────────────────── */
    .foot {
      position: absolute; left: 0; right: 0;
      bottom: calc(12px + var(--safe-bottom));
      z-index: 3;
      text-align: center;
      font-size: 0.72rem; line-height: 1.6;
      letter-spacing: 0.03em;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 2px rgba(4, 19, 74, 0.35);
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .cat { animation: none; opacity: 1; transform: none; }
      #splash.run .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="blob blob-tl"></div>
    <div class="blob blob-tr"></div>
    <div class="blob blob-mr"></div>
    <div class="blob blob-bl"></div>

    <div class="brand">
      <!-- Save your uploaded logo as images/fixia-logo-horizontal.png -->
      <img class="logo" src="images/logo.png" alt="Fixia — All Services. One Place."
           onerror="this.onerror=null;this.src='images/fixia-logo.png'" />

      <div class="cats" aria-hidden="true">
        <!-- home -->
        <div class="cat" style="background:#4d86f7">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-7.5 9 7.5v9.5h-6.5v-6h-5v6H3z"/></svg>
        </div>
        <!-- bolt -->
        <div class="cat" style="background:#6cc4a6">
          <svg viewBox="0 0 24 24"><path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/></svg>
        </div>
        <!-- wrench -->
        <div class="cat" style="background:#ff9168">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4.2 4.2 0 0 0-5.4 5.4L3.5 17.5a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4.2 4.2 0 0 0 5.4-5.4l-2.6 2.6-2.4-.7-.7-2.4z"/></svg>
        </div>
        <!-- car -->
        <div class="cat" style="background:#9a8cf6">
          <svg viewBox="0 0 24 24"><path d="M4 16v-4l2-5h12l2 5v4zM4 16v2.5M20 16v2.5M7 12h10"/><circle cx="7.5" cy="14.5" r=".6"/><circle cx="16.5" cy="14.5" r=".6"/></svg>
        </div>
        <!-- helmet -->
        <div class="cat" style="background:#ffc965">
          <svg viewBox="0 0 24 24"><path d="M4 17a8 8 0 0 1 16 0zM3 17h18v2.5H3zM12 6v5M9 9l-.5 2M15 9l.5 2"/></svg>
        </div>
        <!-- gear -->
        <div class="cat" style="background:#7cc5dd">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
        </div>
        <!-- more -->
        <div class="cat more">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>
        </div>
      </div>

      <div class="bar" role="progressbar" aria-label="Loading"></div>
    </div>

    <!-- Faint skyline with location pin -->
    <svg class="city" viewBox="0 0 400 130" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <g fill="#dfe8f8" opacity="0.7">
        <rect x="10" y="78" width="22" height="52" rx="2"/>
        <rect x="16" y="68" width="10" height="12"/>
        <rect x="46" y="40" width="40" height="90" rx="2"/>
        <rect x="56" y="30" width="14" height="12"/>
        <rect x="104" y="52" width="36" height="78" rx="2"/>
        <rect x="160" y="96" width="34" height="34" rx="2"/>
        <rect x="236" y="96" width="14" height="34"/>
        <rect x="258" y="46" width="50" height="84" rx="2"/>
        <rect x="278" y="26" width="26" height="22"/>
        <rect x="322" y="62" width="32" height="68" rx="2"/>
        <rect x="360" y="82" width="30" height="48" rx="2"/>
      </g>
      <path d="M118 122 Q200 78 282 122" fill="none" stroke="#a9bde6" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.85"/>
      <g transform="translate(200 62)">
        <path d="M0 26C-9 14-13 8-13-1a13 13 0 0 1 26 0c0 9-4 15-13 27z" fill="#a8c0ec"/>
        <circle cx="0" cy="-1" r="5" fill="#eef3fd"/>
      </g>
    </svg>

    <!-- Navy (left) and orange (right) waves -->
    <svg class="waves" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#27428f"/>
          <stop offset="1" stop-color="#4a6bb9"/>
        </linearGradient>
        <linearGradient id="gOrange" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#ff7a30"/>
          <stop offset="1" stop-color="#ff9a55"/>
        </linearGradient>
      </defs>
      <path d="M0 30 C70 28 140 60 230 92 C275 106 320 112 360 112 L0 120 Z" fill="url(#gNavy)"/>
      <path d="M180 120 C250 92 320 62 400 28 L400 120 Z" fill="url(#gOrange)"/>
      <path d="M215 120 C270 108 330 98 400 100 L400 120 Z" fill="#8fa9e0" opacity="0.55"/>
    </svg>

    <div class="foot">
      <div id="ver"></div>
      <div>&copy; <span id="yr">2026</span> ByteStack Labs. All Rights Reserved.</div>
    </div>
  </div>

  <script src="js/version.js"></script>
  <script>
    (function () {
      var MIN_MS = 3000, FADE_MS = 400, t0 = Date.now();
      var splash = document.getElementById('splash');
      splash.style.setProperty('--splash-ms', MIN_MS + 'ms');
      splash.classList.add('run');

      document.getElementById('yr').textContent = new Date().getFullYear();
      if (window.APP_VERSION) document.getElementById('ver').textContent = 'Version ' + window.APP_VERSION;

      // Same storage key the app uses (FX.getSession in js/fixia-data.js)
      var target = 'login.html';
      try {
        var s = JSON.parse(localStorage.getItem('fx_session') || 'null');
        if (s && s.userId) target = 'homepage.html';
      } catch (e) {}

      setTimeout(function () {
        splash.classList.add('hide');
        setTimeout(function () { location.replace(target); }, FADE_MS);
      }, Math.max(0, MIN_MS - (Date.now() - t0)));
    })();
  </script>
</body>
</html>
