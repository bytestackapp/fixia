<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════════

<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Provider — Fixia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand:#FF5A1F; --brand-dark:#D94200; --brand-light:#FFF0EB;
      --navy:#0F1B2D; --navy-mid:#1E3048;
      --text:#1A2332; --text-2:#4A5568; --text-3:#8896A5;
      --bg:#F0F2F5; --card:#FFFFFF; --border:#E8ECF0;
      --green:#10B981; --green-bg:#ECFDF5; --green-text:#065F46;
      --gold:#F59E0B; --gold-bg:#FFFBEB;
      --red:#DC3545; --red-bg:#FFF5F5; --red-text:#991B1B;
      --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
      --shadow-sm:0 1px 4px rgba(0,0,0,0.07);
      --shadow-md:0 4px 16px rgba(0,0,0,0.10);
      --nav-h:56px; --bottom-h:62px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(var(--bottom-h)+16px);-webkit-font-smoothing:antialiased;}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

    /* ── TOP NAV ─────────────────────────────────────────────── */
    .topnav{position:sticky;top:0;z-index:100;background:var(--navy);height:var(--nav-h);display:flex;align-items:center;padding:0 14px;gap:10px;}
    .nav-back{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .nav-title{font-size:0.9rem;font-weight:700;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .nav-share{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

    /* ── HERO ────────────────────────────────────────────────── */
    .hero{background:linear-gradient(135deg,var(--navy),var(--navy-mid));padding:20px 16px 0;}
    .hero-inner{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;}
    .hero-avatar{width:68px;height:68px;border-radius:18px;background:linear-gradient(135deg,#FF5A1F,#D94200);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;color:#fff;flex-shrink:0;position:relative;}
    .elite-crown{position:absolute;top:-10px;right:-10px;font-size:1.1rem;}
    .hero-info{flex:1;min-width:0;padding-top:4px;}
    .hero-name{font-size:1.05rem;font-weight:800;color:#fff;margin-bottom:3px;}
    .hero-service{font-size:0.75rem;color:rgba(255,255,255,0.55);margin-bottom:8px;}
    .hero-badges{display:flex;gap:5px;flex-wrap:wrap;}
    .hbadge{font-size:0.58rem;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em;}
    .hbadge-green{background:rgba(16,185,129,0.2);color:#34D399;}
    .hbadge-gold{background:rgba(245,158,11,0.25);color:#FBBF24;}
    .hbadge-brand{background:rgba(255,90,31,0.2);color:#FF8C5A;}

    /* ── STATS BAR ───────────────────────────────────────────── */
    .stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.08);}
    .sbar-item{background:rgba(255,255,255,0.04);padding:10px 6px;text-align:center;}
    .sbar-val{font-size:1.1rem;font-weight:800;color:#fff;}
    .sbar-label{font-size:0.58rem;font-weight:600;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}

    /* ── CONTACT BAR ─────────────────────────────────────────── */
    .contact-bar{display:flex;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:var(--nav-h);z-index:50;}
    .contact-btn{flex:1;padding:11px;border:none;border-radius:var(--radius-sm);font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.2s;}
    .contact-btn-call{background:linear-gradient(135deg,#FF5A1F,#D94200);color:#fff;box-shadow:0 4px 12px rgba(255,90,31,0.3);}
    .contact-btn-call:hover{transform:translateY(-1px);}
    .contact-btn-msg{background:var(--bg);color:var(--text-2);border:1.5px solid var(--border);}
    .contact-btn-msg:hover{border-color:var(--brand);color:var(--brand);}

    /* ── BODY ────────────────────────────────────────────────── */
    .body{padding:14px 16px;animation:fadeIn 0.3s;}

    /* ── SECTION CARD ────────────────────────────────────────── */
    .sec{background:var(--card);border-radius:var(--radius-md);border:1px solid var(--border);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
    .sec-title{font-size:0.82rem;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .sec-title i{color:var(--brand);}

    /* ── ABOUT ───────────────────────────────────────────────── */
    .about-text{font-size:0.84rem;color:var(--text-2);line-height:1.7;}
    .detail-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.8rem;}
    .detail-row:last-child{border-bottom:none;}
    .detail-icon{width:28px;height:28px;border-radius:8px;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:var(--brand);flex-shrink:0;}
    .detail-label{color:var(--text-3);font-size:0.72rem;}
    .detail-val{color:var(--text);font-weight:600;margin-top:1px;}

    /* ── LISTINGS ────────────────────────────────────────────── */
    .listing-item{padding:11px 0;border-bottom:1px solid var(--border);}
    .listing-item:last-child{border-bottom:none;}
    .li-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
    .li-title{font-size:0.88rem;font-weight:700;color:var(--navy);}
    .li-price{font-size:0.78rem;font-weight:700;color:var(--brand);flex-shrink:0;}
    .li-sub{font-size:0.7rem;color:var(--text-3);margin-bottom:4px;}
    .li-desc{font-size:0.78rem;color:var(--text-2);line-height:1.55;}

    /* ── PORTFOLIO ───────────────────────────────────────────── */
    .portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
    .portfolio-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-sm);cursor:pointer;transition:transform 0.15s;}
    .portfolio-img:active{transform:scale(0.97);}

    /* ── REVIEWS ─────────────────────────────────────────────── */
    .rating-summary{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);}
    .rating-big{font-size:2.5rem;font-weight:800;color:var(--navy);line-height:1;}
    .rating-right{flex:1;}
    .stars-row{display:flex;gap:3px;margin-bottom:3px;}
    .stars-row i{color:var(--gold);font-size:14px;}
    .stars-row i.empty{color:var(--border);}
    .rating-count{font-size:0.72rem;color:var(--text-3);}

    .review-item{padding:11px 0;border-bottom:1px solid var(--border);}
    .review-item:last-child{border-bottom:none;}
    .ri-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
    .ri-stars{display:flex;gap:2px;}
    .ri-stars i{color:var(--gold);font-size:11px;}
    .ri-stars i.empty{color:var(--border);}
    .ri-date{font-size:0.68rem;color:var(--text-3);}
    .ri-comment{font-size:0.8rem;color:var(--text-2);line-height:1.6;}

    /* ── RATE THIS PROVIDER ──────────────────────────────────── */
    .rate-section{background:var(--brand-light);border:1.5px solid rgba(255,90,31,0.2);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
    .rate-title{font-size:0.85rem;font-weight:800;color:var(--brand-dark);margin-bottom:8px;}
    .star-picker{display:flex;gap:6px;margin-bottom:10px;}
    .star-picker i{font-size:1.6rem;color:var(--border);cursor:pointer;transition:color 0.15s;}
    .star-picker i.selected{color:var(--gold);}
    .rate-comment{width:100%;padding:8px 10px;border:1.5px solid rgba(255,90,31,0.2);border-radius:var(--radius-sm);font-size:0.83rem;font-family:inherit;resize:vertical;min-height:65px;color:var(--text);background:#fff;}
    .rate-comment:focus{outline:none;border-color:var(--brand);}
    .rate-btn{margin-top:8px;padding:9px 20px;background:linear-gradient(135deg,#FF5A1F,#D94200);color:#fff;border:none;border-radius:var(--radius-sm);font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;}
    .rate-alert{font-size:0.75rem;margin-top:6px;padding:6px 10px;border-radius:6px;display:none;}
    .rate-alert.show{display:block;}
    .rate-alert.ok{background:var(--green-bg);color:var(--green-text);}
    .rate-alert.err{background:var(--red-bg);color:var(--red-text);}

    /* ── AD INLINE ───────────────────────────────────────────── */
    .ad-inline{background:linear-gradient(90deg,#0f2027,#203a43);border-radius:var(--radius-md);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;}
    .ai-label{font-size:0.55rem;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.3);text-transform:uppercase;}
    .ai-title{font-size:0.82rem;font-weight:700;color:#fff;}
    .ai-sub{font-size:0.68rem;color:rgba(255,255,255,0.5);}
    .ai-icon{font-size:1.8rem;flex-shrink:0;}
    .ai-btn{margin-left:auto;background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:0.68rem;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;flex-shrink:0;font-family:inherit;}

    /* ── BOTTOM NAV ──────────────────────────────────────────── */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--border);height:var(--bottom-h);display:flex;align-items:center;box-shadow:0 -4px 20px rgba(0,0,0,0.07);}
    .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 0;color:var(--text-3);font-size:0.58rem;font-weight:600;transition:color 0.15s;border:none;background:none;font-family:inherit;}
    .bnav-item i{font-size:1.05rem;}
    .bnav-item.active{color:var(--brand);}

    /* ── MODAL (image lightbox) ──────────────────────────────── */
    .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;padding:1rem;}
    .lightbox.open{display:flex;}
    .lightbox img{max-width:100%;max-height:90vh;border-radius:var(--radius-sm);object-fit:contain;}
    .lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:1.2rem;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}

    /* ── LOADING / EMPTY ─────────────────────────────────────── */
    .loading-state{text-align:center;padding:3rem 1rem;color:var(--text-3);font-size:0.85rem;}
    .load-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .empty{text-align:center;padding:1.5rem;color:var(--text-3);font-size:0.8rem;}
  </style>
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
  <button class="nav-back" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="nav-title" id="navTitle">Loading…</div>
  <button class="nav-share" onclick="shareProfile()" title="Share"><i class="fa-solid fa-share-nodes"></i></button>
</nav>

<!-- HERO -->
<div class="hero" id="heroSection" style="display:none;">
  <div class="hero-inner">
    <div class="hero-avatar" id="heroAvatar">?
      <div class="elite-crown" id="heroEliteCrown" style="display:none;">👑</div>
    </div>
    <div class="hero-info">
      <div class="hero-name" id="heroName">—</div>
      <div class="hero-service" id="heroService">—</div>
      <div class="hero-badges" id="heroBadges"></div>
    </div>
  </div>
  <div class="stats-bar">
    <div class="sbar-item"><div class="sbar-val" id="sbRating">—</div><div class="sbar-label">Rating</div></div>
    <div class="sbar-item"><div class="sbar-val" id="sbReviews">—</div><div class="sbar-label">Reviews</div></div>
    <div class="sbar-item"><div class="sbar-val" id="sbListings">—</div><div class="sbar-label">Services</div></div>
  </div>
</div>

<!-- CONTACT BAR -->
<div class="contact-bar" id="contactBar" style="display:none;">
  <button class="contact-btn contact-btn-call" id="callBtn" onclick="callProvider()">
    <i class="fa-solid fa-phone"></i> Call Now
  </button>
  <button class="contact-btn contact-btn-msg" id="smsBtn" onclick="smsProvider()">
    <i class="fa-solid fa-comment-sms"></i> Send SMS
  </button>
</div>

<!-- BODY -->
<div class="body" id="bodySection" style="display:none;">

  <!-- About -->
  <div class="sec">
    <div class="sec-title"><i class="fa-solid fa-circle-info"></i> About</div>
    <div class="about-text" id="aboutText">—</div>
    <div style="margin-top:12px;" id="detailRows"></div>
  </div>

  <!-- Inline Ad (free users only) -->
  <div id="adSlot"></div>

  <!-- Portfolio -->
  <div class="sec" id="portfolioSec" style="display:none;">
    <div class="sec-title"><i class="fa-solid fa-images"></i> Portfolio</div>
    <div class="portfolio-grid" id="portfolioGrid"></div>
  </div>

  <!-- Services / Listings -->
  <div class="sec" id="listingsSec" style="display:none;">
    <div class="sec-title"><i class="fa-solid fa-list-check"></i> Services Offered</div>
    <div id="listingsBody"></div>
  </div>

  <!-- Rate this provider -->
  <div class="rate-section" id="rateSection" style="display:none;">
    <div class="rate-title"><i class="fa-solid fa-star" style="color:var(--gold);"></i> Rate this Provider</div>
    <div class="star-picker" id="starPicker">
      <i class="fa-solid fa-star" data-star="1" onclick="pickStar(1)"></i>
      <i class="fa-solid fa-star" data-star="2" onclick="pickStar(2)"></i>
      <i class="fa-solid fa-star" data-star="3" onclick="pickStar(3)"></i>
      <i class="fa-solid fa-star" data-star="4" onclick="pickStar(4)"></i>
      <i class="fa-solid fa-star" data-star="5" onclick="pickStar(5)"></i>
    </div>
    <textarea class="rate-comment" id="rateComment" placeholder="Share your experience… (optional)"></textarea>
    <div class="rate-alert" id="rateAlert"></div>
    <button class="rate-btn" onclick="submitRating()">
      <i class="fa-solid fa-paper-plane"></i> Submit Rating
    </button>
  </div>

  <!-- Reviews -->
  <div class="sec">
    <div class="sec-title"><i class="fa-solid fa-star"></i> Customer Reviews</div>
    <div id="reviewsBody"><div class="empty">Loading reviews…</div></div>
  </div>

</div>

<!-- Loading state -->
<div id="loadingState" class="loading-state">
  <div class="load-spinner"></div>
  Loading provider…
</div>

<!-- Error state -->
<div id="errorState" style="display:none;text-align:center;padding:3rem 1rem;">
  <div style="font-size:2.5rem;margin-bottom:8px;">😕</div>
  <div style="font-size:0.9rem;font-weight:700;color:var(--navy);margin-bottom:4px;">Provider not found</div>
  <div style="font-size:0.8rem;color:var(--text-3);margin-bottom:1rem;">This provider may no longer be active on Fixia.</div>
  <button onclick="window.location.href='homepage.html'" style="background:var(--brand);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 20px;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit;">
    Back to Home
  </button>
</div>

<!-- Image Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close">×</button>
  <img id="lightboxImg" src="" alt="Portfolio"/>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="bnav-item" onclick="window.location.href='homepage.html'"><i class="fa-solid fa-house"></i>Home</button>
  <button class="bnav-item" onclick="window.location.href='browse.html'"><i class="fa-solid fa-grid-2"></i>Browse</button>
  <button class="bnav-item" onclick="window.location.href='search.html'"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
  <button class="bnav-item" onclick="window.location.href='saved.html'"><i class="fa-regular fa-bookmark"></i>Saved</button>
  <button class="bnav-item" onclick="window.location.href='profile.html'"><i class="fa-regular fa-user"></i>Profile</button>
</nav>

<script src="fixia-data.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════ */
let provider = null;
let providerUser = null;
let listings = [];
let reviews  = [];
let selectedStars = 0;
const session = FX.getSession();

/* ══════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════ */
(async function init() {
  // Init pop-up ads for free regular users
  FX.initAds();

  const params     = new URLSearchParams(window.location.search);
  const providerId = params.get('id');

  if (!providerId) { showError(); return; }

  try {
    provider = await FX.getProviderById(providerId);
    if (!provider || provider.status !== 'approved') { showError(); return; }

    providerUser = await FX.getUserById(provider.user_id);
    [listings, reviews] = await Promise.all([
      FX.getListingsByProvider(providerId),
      FX.getRatingsByProvider(providerId),
    ]);

    renderPage();
  } catch(e) {
    showError();
  }
})();

/* ══════════════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════════════ */
function renderPage() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('heroSection').style.display  = 'block';
  document.getElementById('contactBar').style.display   = 'flex';
  document.getElementById('bodySection').style.display  = 'block';

  const initials = (providerUser?.first_name?.[0] || '') + (providerUser?.last_name?.[0] || '');
  document.getElementById('heroAvatar').childNodes[0].nodeValue = initials || '?';
  document.getElementById('navTitle').textContent   = provider.biz_name;
  document.getElementById('heroName').textContent   = provider.biz_name;
  document.getElementById('heroService').textContent = `${provider.cat_sub} · ${provider.city_name}`;

  // Elite
  if (provider.is_elite) {
    document.getElementById('heroEliteCrown').style.display = 'block';
    document.getElementById('heroBadges').innerHTML +=
      '<span class="hbadge hbadge-gold">👑 Fixia Elite</span>';
  }
  if (provider.is_featured) {
    document.getElementById('heroBadges').innerHTML +=
      '<span class="hbadge hbadge-brand">⭐ Featured</span>';
  }
  document.getElementById('heroBadges').innerHTML +=
    '<span class="hbadge hbadge-green">✅ Verified</span>';

  // Stats
  document.getElementById('sbRating').textContent   = provider.avg_rating   || '0.0';
  document.getElementById('sbReviews').textContent  = provider.total_ratings || '0';
  document.getElementById('sbListings').textContent = listings.length;

  // About
  document.getElementById('aboutText').textContent = provider.biz_desc || 'No description provided.';

  // Detail rows
  const loc = [
    provider.barangay_name,
    provider.city_name,
    provider.province_name,
  ].filter(Boolean).join(', ');

  document.getElementById('detailRows').innerHTML = `
    <div class="detail-row">
      <div class="detail-icon"><i class="fa-solid fa-location-dot"></i></div>
      <div><div class="detail-label">Location</div><div class="detail-val">${loc || '—'}</div></div>
    </div>
    <div class="detail-row">
      <div class="detail-icon"><i class="fa-solid fa-wrench"></i></div>
      <div><div class="detail-label">Service Type</div><div class="detail-val">${provider.cat_sub}</div></div>
    </div>
    <div class="detail-row">
      <div class="detail-icon"><i class="fa-solid fa-user-tie"></i></div>
      <div><div class="detail-label">Provider Type</div><div class="detail-val">${capitalize(provider.prov_type)}</div></div>
    </div>
    ${provider.experience ? `
    <div class="detail-row">
      <div class="detail-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
      <div><div class="detail-label">Experience</div><div class="detail-val">${provider.experience} years</div></div>
    </div>` : ''}`;

  // Inline ad for free regular users
  if (!session || (session.role === 'regular' && !session.adsFree)) {
    document.getElementById('adSlot').innerHTML = `
      <div class="ad-inline" onclick="">
        <div class="ai-icon">🏗️</div>
        <div style="flex:1;min-width:0;">
          <div class="ai-label">Sponsored</div>
          <div class="ai-title">BuildRight Construction</div>
          <div class="ai-sub">Free renovation estimates</div>
        </div>
        <button class="ai-btn">Visit</button>
      </div>`;
  }

  // Portfolio
  if ((provider.portfolio_urls || []).length) {
    document.getElementById('portfolioSec').style.display = 'block';
    document.getElementById('portfolioGrid').innerHTML =
      provider.portfolio_urls.map(url =>
        `<img class="portfolio-img" src="${url}" alt="Portfolio" onclick="openLightbox('${url}')"/>`
      ).join('');
  }

  // Listings
  const activeListing = listings.filter(l => l.is_active);
  if (activeListing.length) {
    document.getElementById('listingsSec').style.display = 'block';
    document.getElementById('listingsBody').innerHTML = activeListing.map(l => `
      <div class="listing-item">
        <div class="li-head">
          <div class="li-title">${l.title}</div>
          ${l.price_label ? `<div class="li-price">${l.price_label}</div>` : ''}
        </div>
        <div class="li-sub">${l.cat_sub || ''}</div>
        <div class="li-desc">${l.description || ''}</div>
      </div>`).join('');
  }

  // Rating section (only for logged-in regular users)
  if (session && session.role === 'regular') {
    document.getElementById('rateSection').style.display = 'block';
  }

  // Reviews
  renderReviews();
}

function renderReviews() {
  const body = document.getElementById('reviewsBody');
  if (!reviews.length) {
    body.innerHTML = '<div class="empty">No reviews yet. Be the first to rate this provider!</div>';
    return;
  }

  const avg = provider.avg_rating || 0;
  const filledStars = Array.from({length:5}, (_,i) =>
    `<i class="fa-solid fa-star${i >= Math.round(avg) ? ' empty' : ''}"></i>`
  ).join('');

  body.innerHTML = `
    <div class="rating-summary">
      <div class="rating-big">${avg}</div>
      <div class="rating-right">
        <div class="stars-row">${filledStars}</div>
        <div class="rating-count">${reviews.length} review${reviews.length !== 1 ? 's' : ''}</div>
      </div>
    </div>
    ${reviews.map(r => {
      const stars = Array.from({length:5}, (_,i) =>
        `<i class="fa-solid fa-star${i >= r.stars ? ' empty' : ''}"></i>`
      ).join('');
      return `
      <div class="review-item">
        <div class="ri-head">
          <div class="ri-stars">${stars}</div>
          <div class="ri-date">${fmtDate(r.created_at)}</div>
        </div>
        <div class="ri-comment">${r.comment || '<em style="color:var(--text-3);">No comment.</em>'}</div>
      </div>`;
    }).join('')}`;
}

/* ══════════════════════════════════════════════════════════════
   CONTACT
══════════════════════════════════════════════════════════════ */
function callProvider() {
  const phone = providerUser?.phone;
  if (!phone) { alert('Contact number not available.'); return; }
  window.location.href = `tel:${phone}`;
}

function smsProvider() {
  const phone = providerUser?.phone;
  if (!phone) { alert('Contact number not available.'); return; }
  window.location.href = `sms:${phone}`;
}

/* ══════════════════════════════════════════════════════════════
   RATING
══════════════════════════════════════════════════════════════ */
function pickStar(n) {
  selectedStars = n;
  document.querySelectorAll('#starPicker i').forEach((star, i) => {
    star.classList.toggle('selected', i < n);
  });
}

async function submitRating() {
  const rateAlert = document.getElementById('rateAlert');
  rateAlert.className = 'rate-alert';

  if (!session || session.role !== 'regular') {
    rateAlert.className = 'rate-alert show err';
    rateAlert.textContent = 'Please log in as a regular user to leave a rating.';
    return;
  }
  if (!selectedStars) {
    rateAlert.className = 'rate-alert show err';
    rateAlert.textContent = 'Please select a star rating first.';
    return;
  }

  const comment = document.getElementById('rateComment').value.trim();

  try {
    await FX.addRating({
      providerId: provider.id,
      userId:     session.userId,
      stars:      selectedStars,
      comment,
    });

    rateAlert.className = 'rate-alert show ok';
    rateAlert.textContent = '✅ Thank you for your rating!';

    // Refresh reviews
    reviews  = await FX.getRatingsByProvider(provider.id);
    provider = await FX.getProviderById(provider.id);
    document.getElementById('sbRating').textContent  = provider.avg_rating   || '0.0';
    document.getElementById('sbReviews').textContent = provider.total_ratings || '0';
    renderReviews();

    // Reset picker
    selectedStars = 0;
    document.querySelectorAll('#starPicker i').forEach(s => s.classList.remove('selected'));
    document.getElementById('rateComment').value = '';

    // Hide rate section after submitting
    setTimeout(() => {
      document.getElementById('rateSection').style.display = 'none';
    }, 2000);

  } catch(e) {
    rateAlert.className = 'rate-alert show err';
    rateAlert.textContent = 'Failed to submit rating: ' + (e.message || 'Please try again.');
  }
}

/* ══════════════════════════════════════════════════════════════
   SHARE
══════════════════════════════════════════════════════════════ */
function shareProfile() {
  const url   = window.location.href;
  const title = provider?.biz_name || 'Check out this provider on Fixia';
  if (navigator.share) {
    navigator.share({ title, url }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(url)
      .then(() => alert('Link copied to clipboard!'))
      .catch(() => alert('Share link: ' + url));
  }
}

/* ══════════════════════════════════════════════════════════════
   LIGHTBOX
══════════════════════════════════════════════════════════════ */
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

/* ══════════════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════════════ */
function showError() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorState').style.display   = 'block';
}

function capitalize(s) {
  if (!s) return '—';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' });
}
