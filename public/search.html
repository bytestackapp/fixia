<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.json">
  
  <title>Search — Fixia</title>
  <style>
    :root {
      --brand:#FF5A1F; --brand-dark:#D94200; --brand-light:#FFF0EB;
      --navy:#0F1B2D; --navy-mid:#1E3048;
      --text:#1A2332; --text-2:#4A5568; --text-3:#8896A5;
      --bg:#F0F2F5; --card:#FFFFFF; --border:#E8ECF0;
      --green:#10B981; --green-bg:#ECFDF5; --green-text:#065F46;
      --gold:#F59E0B;
      --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
      --shadow-sm:0 1px 4px rgba(0,0,0,0.07);
      --nav-h:56px; --bottom-h:62px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(var(--bottom-h)+16px);-webkit-font-smoothing:antialiased;}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

    /* ── TOP NAV ─────────────────────────────────────────────── */
    .topnav{position:sticky;top:0;z-index:100;background:var(--navy);padding:env(safe-area-inset-top) 16px 0;height:calc(var(--nav-h) + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;}
    .nav-back{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .nav-search-wrap{flex:1;display:flex;align-items:center;background:rgba(255,255,255,0.10);border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:0 12px;height:36px;gap:8px;}
    .nav-search-wrap:focus-within{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.35);}
    .nav-search-wrap i{color:rgba(255,255,255,0.5);font-size:12px;}
    .nav-search-wrap input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:0.82rem;font-family:inherit;}
    .nav-search-wrap input::placeholder{color:rgba(255,255,255,0.45);}
    .nav-clear{background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:12px;padding:2px;}
    .nav-clear:hover{color:#fff;}

    /* ── FILTER BAR ──────────────────────────────────────────── */
    .filter-bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;position:sticky;top:var(--nav-h);z-index:50;}
    .filter-bar::-webkit-scrollbar{display:none;}
    .chip{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:0.72rem;font-weight:700;border:1.5px solid var(--border);background:#fff;color:var(--text-3);cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap;display:flex;align-items:center;gap:5px;}
    .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}
    .chip i{font-size:10px;}

    /* ── RESULTS HEADER ──────────────────────────────────────── */
    .results-header{padding:12px 16px 6px;display:flex;align-items:center;justify-content:space-between;}
    .results-count{font-size:0.8rem;color:var(--text-3);font-weight:600;}
    .results-count strong{color:var(--navy);}
    .sort-btn{background:none;border:1.5px solid var(--border);border-radius:20px;padding:5px 12px;font-size:0.72rem;font-weight:700;color:var(--text-2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;}
    .sort-btn:hover{border-color:var(--brand);color:var(--brand);}

    /* ── PROVIDER CARD ───────────────────────────────────────── */
    .results-list{padding:0 16px;}
    .provider-card{background:var(--card);border-radius:var(--radius-md);border:1px solid var(--border);padding:14px;display:flex;gap:12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow 0.15s;animation:slideUp 0.3s ease both;}
    .provider-card:active{box-shadow:0 4px 16px rgba(0,0,0,0.10);}
    .provider-avatar{width:54px;height:54px;border-radius:14px;background:var(--brand-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;color:var(--brand);position:relative;}
    .online-dot{position:absolute;bottom:3px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--card);}
    .provider-info{flex:1;min-width:0;}
    .provider-name{font-size:0.9rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;}
    .provider-name .elite{color:var(--gold);font-size:0.85rem;}
    .provider-service{font-size:0.72rem;color:var(--brand);font-weight:600;margin-bottom:5px;}
    .provider-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .pmeta{display:flex;align-items:center;gap:3px;font-size:0.68rem;color:var(--text-3);}
    .pmeta i{font-size:9px;}
    .stars-mini{display:flex;align-items:center;gap:2px;}
    .stars-mini i{color:var(--gold);font-size:10px;}
    .stars-mini span{font-size:0.68rem;color:var(--text-2);font-weight:600;}
    .provider-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex-shrink:0;}
    .verified-badge{background:var(--green-bg);color:var(--green-text);font-size:0.58rem;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
    .contact-btn{background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:0.7rem;font-weight:700;padding:6px 11px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:3px;}

    /* ── AD INLINE ───────────────────────────────────────────── */
    .ad-inline{background:linear-gradient(90deg,#0f2027,#203a43);border-radius:var(--radius-md);padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;}
    .ai-icon{font-size:1.6rem;flex-shrink:0;}
    .ai-body{flex:1;min-width:0;}
    .ai-label{font-size:0.55rem;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.3);text-transform:uppercase;}
    .ai-title{font-size:0.8rem;font-weight:700;color:#fff;}
    .ai-sub{font-size:0.65rem;color:rgba(255,255,255,0.5);}
    .ai-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:0.65rem;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;flex-shrink:0;font-family:inherit;}

    /* ── EMPTY / LOADING ─────────────────────────────────────── */
    .state-box{text-align:center;padding:3rem 1rem;}
    .state-icon{font-size:2.5rem;margin-bottom:10px;}
    .state-title{font-size:0.95rem;font-weight:800;color:var(--navy);margin-bottom:4px;}
    .state-sub{font-size:0.8rem;color:var(--text-3);line-height:1.6;}
    .load-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── SORT SHEET ──────────────────────────────────────────── */
    .sheet-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.5);backdrop-filter:blur(3px);align-items:flex-end;justify-content:center;}
    .sheet-overlay.open{display:flex;animation:fadeIn 0.2s;}
    .sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:0 0 28px;}
    .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:12px auto 0;}
    .sheet-title{font-size:0.9rem;font-weight:800;color:var(--navy);padding:14px 18px 10px;border-bottom:1px solid var(--border);}
    .sort-option{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;border-bottom:1px solid var(--border);font-size:0.85rem;font-weight:600;color:var(--text-2);}
    .sort-option:last-child{border-bottom:none;}
    .sort-option:hover{background:var(--bg);}
    .sort-option.selected{color:var(--brand);}
    .sort-option i{color:var(--brand);font-size:13px;}

    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--border);height:calc(var(--bottom-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;box-shadow:0 -4px 20px rgba(0,0,0,0.07);}
    .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 0;color:var(--text-3);font-size:0.58rem;font-weight:600;transition:color 0.15s;border:none;background:none;font-family:inherit;text-decoration:none;position:relative;}
    .bnav-item i{font-size:1.05rem;}
    .bnav-item.active{color:var(--brand);}
    .bnav-center{flex:0 0 64px;display:flex;align-items:center;justify-content:center;}
    .bnav-center-btn{width:48px;height:48px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 4px 14px rgba(255,90,31,0.4);cursor:pointer;border:none;transform:translateY(-8px);}
  </style>
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/fixia.css">
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
  <button class="nav-back" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="nav-search-wrap">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="Search services, providers…" autocomplete="off"/>
    <button class="nav-clear" id="clearBtn" onclick="clearSearch()" style="display:none;">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
</nav>

<!-- FILTER CHIPS -->
<div class="filter-bar">
  <button class="chip active" onclick="setFilter('all',this)"><i class="fa-solid fa-border-all"></i> All</button>
  <button class="chip" onclick="setFilter('elite',this)">👑 Elite</button>
  <button class="chip" onclick="setFilter('top',this)"><i class="fa-solid fa-star"></i> Top Rated</button>
  <button class="chip" onclick="setFilter('verified',this)"><i class="fa-solid fa-check"></i> Verified</button>
  <button class="chip" onclick="setFilter('home',this)">🏠 Home</button>
  <button class="chip" onclick="setFilter('auto',this)">🚗 Auto</button>
  <button class="chip" onclick="setFilter('elec',this)">⚡ Electrical</button>
  <button class="chip" onclick="setFilter('build',this)">🔨 Construction</button>
  <button class="chip" onclick="setFilter('tech',this)">💻 Tech</button>
  <button class="chip" onclick="setFilter('beauty',this)">💇 Beauty</button>
  <button class="chip" onclick="setFilter('clean',this)">🧹 Cleaning</button>
  <button class="chip" onclick="setFilter('garden',this)">🌿 Garden</button>
  <button class="chip" onclick="setFilter('pet',this)">🐾 Pets</button>
  <button class="chip" onclick="setFilter('event',this)">🎉 Events</button>
</div>

<!-- RESULTS HEADER -->
<div class="results-header">
  <div class="results-count" id="resultsCount">Searching…</div>
  <button class="sort-btn" onclick="openSortSheet()">
    <i class="fa-solid fa-arrow-up-wide-short"></i> <span id="sortLabel">Sort</span>
  </button>
</div>

<!-- RESULTS -->
<div class="results-list" id="resultsList">
  <div class="state-box">
    <div class="load-spinner"></div>
    <div class="state-sub">Finding providers…</div>
  </div>
</div>

<!-- SORT SHEET -->
<div class="sheet-overlay" id="sortSheet" onclick="handleSheetClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Sort Results</div>
    <div class="sort-option selected" id="sort_rating" onclick="setSort('rating','Top Rated')">
      Top Rated <i class="fa-solid fa-check"></i>
    </div>
    <div class="sort-option" id="sort_elite" onclick="setSort('elite','Fixia Elite First')">
      Fixia Elite First
    </div>
    <div class="sort-option" id="sort_newest" onclick="setSort('newest','Newest')">
      Newest
    </div>
    <div class="sort-option" id="sort_reviews" onclick="setSort('reviews','Most Reviews')">
      Most Reviews
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="bnav-item" href="homepage.html"><i class="fa-solid fa-house"></i>Home</a>
  <a class="bnav-item" href="saved.html"><i class="fa-regular fa-bookmark"></i>Saved</a>
  <div class="bnav-center">
    <button class="bnav-center-btn" onclick="window.location.href='browse.html'">
      <i class="fa-solid fa-border-all"></i>
    </button>
  </div>
  <a class="bnav-item" href="bookings.html">
    <i class="fa-solid fa-clipboard-list"></i>Bookings
  </a>
  <a class="bnav-item" href="profile.html"><i class="fa-regular fa-user"></i>Profile</a>
</nav>

<script src="env-config.js"></script>
<script src="fixia-data.js"></script>
<script src="js/fx-boot.js"></script>
<script>
let allProviders = [];
let filtered     = [];
let currentFilter = 'all';
let currentSort   = 'rating';
let currentQuery  = '';
const session = FX.getSession();

/* ── Init ──────────────────────────────────────────────────── */
(async function init() {
  await FX.initAds();

  // Get query from URL
  const params = new URLSearchParams(window.location.search);
  currentQuery = params.get('q') || '';
  if (currentQuery) {
    document.getElementById('searchInput').value = currentQuery;
    document.getElementById('clearBtn').style.display = 'block';
  }

  // Load all approved providers
  try {
    allProviders = await FX.getProviders({});
    applyFilters();
  } catch(e) {
    showEmpty('⚠️', 'Failed to load results', 'Please check your connection and try again.');
  }

  // Search input live
  document.getElementById('searchInput').addEventListener('input', function() {
    currentQuery = this.value.trim();
    document.getElementById('clearBtn').style.display = currentQuery ? 'block' : 'none';
    applyFilters();
    // Update URL without reload
    const url = new URL(window.location);
    currentQuery ? url.searchParams.set('q', currentQuery) : url.searchParams.delete('q');
    window.history.replaceState({}, '', url);
  });

  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Escape') clearSearch();
  });
})();

/* ── Filtering & sorting ────────────────────────────────────── */
function applyFilters() {
  let list = [...allProviders];

  // Text search
  if (currentQuery) {
    const q = currentQuery.toLowerCase();
	list = list.filter(p =>
      p.biz_name?.toLowerCase().includes(q)                              ||
      p.biz_desc?.toLowerCase().includes(q)                              ||
      p.city_name?.toLowerCase().includes(q)                             ||
      p.province_name?.toLowerCase().includes(q)                         ||
      p._listing_cats?.some(c => c.toLowerCase().includes(q))            ||
      p.cat_sub?.toLowerCase().includes(q)                               ||
      p.cat_main?.toLowerCase().includes(q)
    );
  }

  // Category / special filter
  if (currentFilter === 'elite')    list = list.filter(p => p.is_elite);
  else if (currentFilter === 'top') list = list.filter(p => p.avg_rating >= 4);
  else if (currentFilter === 'verified') list = list.filter(p => p.status === 'approved');
  else if (currentFilter !== 'all') list = list.filter(p =>
    p._listing_cats?.length
      ? p._listing_cats_main?.includes(currentFilter)
      : p.cat_main === currentFilter
  );

  // Sort
  if (currentSort === 'rating')  list.sort((a,b) => b.avg_rating - a.avg_rating);
  if (currentSort === 'elite')   list.sort((a,b) => (b.is_elite ? 1 : 0) - (a.is_elite ? 1 : 0) || b.avg_rating - a.avg_rating);
  if (currentSort === 'newest')  list.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  if (currentSort === 'reviews') list.sort((a,b) => b.total_ratings - a.total_ratings);

  filtered = list;
  renderResults();
  // Ad trigger — after search results shown (natural pause point)
  if (filtered.length > 0) FX.adTrigger('search_done');
}

function renderResults() {
  const list = document.getElementById('resultsList');
  list.innerHTML = '';
  const q    = currentQuery ? `"${currentQuery}"` : 'All providers';

  document.getElementById('resultsCount').innerHTML =
    `<strong>${filtered.length}</strong> result${filtered.length !== 1 ? 's' : ''} for ${q}`;

  if (!filtered.length) {
    showEmpty('🔍', 'No providers found',
      currentQuery
        ? `No results for "${currentQuery}". Try a different keyword or category.`
        : 'No providers match this filter yet. Try a different category.');
    return;
  }

  filtered.forEach((p, i) => {
    const initials = (p.biz_name || '?').charAt(0).toUpperCase();
    const stars = Array.from({length:5}, (_,idx) =>
      `<i class="fa-${idx < Math.round(p.avg_rating) ? 'solid' : 'regular'} fa-star"></i>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'provider-card';
    card.style.animationDelay = `${i * 0.04}s`;
    card.onclick = () => window.location.href = `provider.html?id=${p.id}`;
    card.innerHTML = `
      <div class="provider-avatar">
        ${p.avatar_url
          ? `<img src="${p.avatar_url}" alt="${esc(p.biz_name)}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">`
          : initials}
        ${p.status === 'approved' ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="provider-info">
        <div class="provider-name">
          ${p.is_elite ? '<span class="elite">👑 </span>' : ''}${esc(p.biz_name)}
        </div>
		<div class="provider-service">${esc([p.city_name, p.province_name].filter(Boolean).join(', ') || '—')}</div>
        <div class="provider-meta">
          <div class="stars-mini">${stars}<span>${p.avg_rating || 0} (${p.total_ratings || 0})</span></div>
          <div class="pmeta"><i class="fa-solid fa-location-dot"></i>${esc(p.city_name || '—')}</div>
        </div>
      </div>
      <div class="provider-right">
        <span class="verified-badge">✅ Verified</span>
        <button class="contact-btn" onclick="event.stopPropagation();window.location.href='provider.html?id=${p.id}'">
          <i class="fa-solid fa-eye"></i> View
        </button>
      </div>`;
    list.appendChild(card);
  });
  FX.injectInlineAds('resultsList', FX.AD_CONFIG?.inlineIntervalSearch ?? 4);
}

function showEmpty(icon, title, sub) {
  document.getElementById('resultsList').innerHTML = `
    <div class="state-box">
      <div class="state-icon">${icon}</div>
      <div class="state-title">${title}</div>
      <div class="state-sub">${sub}</div>
    </div>`;
  document.getElementById('resultsCount').innerHTML = '<strong>0</strong> results';
}

/* ── Filter chips ───────────────────────────────────────────── */
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

/* ── Sort ───────────────────────────────────────────────────── */
function openSortSheet() { document.getElementById('sortSheet').classList.add('open'); }
function handleSheetClick(e) { if (e.target === document.getElementById('sortSheet')) document.getElementById('sortSheet').classList.remove('open'); }

function setSort(key, label) {
  currentSort = key;
  document.getElementById('sortLabel').textContent = label;
  document.querySelectorAll('.sort-option').forEach(o => {
    o.classList.remove('selected');
    o.innerHTML = o.innerHTML.replace(/<i.*<\/i>/, '');
  });
  const el = document.getElementById('sort_' + key);
  el.classList.add('selected');
  el.innerHTML += ' <i class="fa-solid fa-check"></i>';
  document.getElementById('sortSheet').classList.remove('open');
  applyFilters();
}

/* ── Clear search ───────────────────────────────────────────── */
function clearSearch() {
  currentQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('searchInput').focus();
  const url = new URL(window.location);
  url.searchParams.delete('q');
  window.history.replaceState({}, '', url);
  applyFilters();
}
</script>

<script>
// Load notification bell badge
(async function loadNotifBadge() {
  const sess = FX.getSession();
  if (!sess || sess.role !== 'regular') return;
  try {
    const count = await FX.getUnreadCount('regular', sess.userId);
    const badge = document.getElementById('notifBellBadge');
    if (badge && count > 0) {
      badge.textContent = count > 9 ? '9+' : count;
      badge.style.display = 'flex';
    }
  } catch(e) {}
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>

</body>
</html>
