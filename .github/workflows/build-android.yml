name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }

      - name: Check secrets
        env:
          API_BASE: ${{ secrets.API_BASE }}
          FIXIA_KEYSTORE_B64: ${{ secrets.FIXIA_KEYSTORE_B64 }}
          FIXIA_KEYSTORE_PASSWORD: ${{ secrets.FIXIA_KEYSTORE_PASSWORD }}
        run: |
          for v in API_BASE FIXIA_KEYSTORE_B64 FIXIA_KEYSTORE_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; exit 1; fi
          done

      - run: npm install

      - name: Build web app for the phone
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.API_BASE }}   # your Vercel address, no trailing slash
          VITE_NATIVE: '1'

      - name: Write keystore
        env: { KS: "${{ secrets.FIXIA_KEYSTORE_B64 }}" }
        run: printf '%s' "$KS" | base64 -d > android/app/fixia.keystore

      - run: npx cap sync android
      - run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          FIXIA_KEYSTORE_PASSWORD: ${{ secrets.FIXIA_KEYSTORE_PASSWORD }}

      - name: Verify signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs android/app/build/outputs/apk/release/fixia.apk

      - uses: actions/upload-artifact@v7
        with:
          name: fixia
          path: android/app/build/outputs/apk/release/fixia.apk
          if-no-files-found: error
          retention-days: 30